# ADDED FOR DEPLOYMENT — Render deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: livestock-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: SECRET_KEY
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel frontend URL
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MODELS_DIR
        value: ./models
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /docs
